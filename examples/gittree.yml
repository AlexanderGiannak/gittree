# Copy to .github/workflows/gittree.yml in your profile repository (the one named after your username).
name: Grow GitTree

on:
  schedule:
    - cron: "17 * * * *" # every hour; see "How often it updates" in the GitTree README to change this
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gittree
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: AlexanderGiannak/gittree@v1
